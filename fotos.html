<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Fotos de avance</title>
<link rel="icon" href="icon-192-v2.png">
<style>
@font-face { font-family: 'URW Gothic'; src: url('fonts/URWGothic-Book.ttf') format('truetype'); font-weight: 300 700; font-display: swap; }
:root { --primary: #b45309; --dark: #92400e; --bg: #fef3c7; --text: #1e293b; --muted: #64748b; --border: #f3e8c8; --green: #15803d; --red: #b91c1c; }
* { box-sizing: border-box; }
body { margin: 0; background: #fffbeb; color: var(--text); font-family: 'URW Gothic', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
.cab { background: var(--primary); color: #fff; padding: 26px 18px 54px; }
.cab .obra { font-size: 13px; opacity: .85; text-transform: uppercase; letter-spacing: .06em; }
.cab h1 { margin: 4px 0 2px; font-size: 22px; line-height: 1.15; font-weight: 700; }
.cab .sub { font-size: 14px; opacity: .9; }
main { max-width: 560px; margin: -36px auto 0; padding: 0 12px 40px; }
.card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 12px; }
.hola { font-size: 17px; font-weight: 700; } .hola + p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; margin: 14px 0 4px; }
.bts { display: flex; gap: 8px; margin-top: 12px; }
.btn { border: 0; border-radius: 12px; padding: 12px 14px; font: inherit; font-weight: 700; cursor: pointer; background: var(--primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.sec { background: #fff; color: var(--dark); border: 1.5px solid #fcd34d; } .btn.full { width: 100%; font-size: 16px; margin-top: 14px; } .bts .btn { flex: 1; }
.btn[disabled] { opacity: .5; cursor: default; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; } .grid:empty { display: none; }
.th { position: relative; aspect-ratio: 1; border-radius: 10px; background: #f1f5f9 center/cover no-repeat; }
.th button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(15,23,42,.6); color: #fff; font-size: 15px; line-height: 26px; cursor: pointer; }
.th.ok::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #fff; background: rgba(21,128,61,.45); border-radius: 10px; }
select, input { width: 100%; border: 1.5px solid var(--border); border-radius: 12px; padding: 11px 12px; font: inherit; font-size: 16px; background: #fff; }
.ok-box { text-align: center; padding: 24px 12px; } .ok-box .em { font-size: 44px; } .ok-box h2 { margin: 8px 0 4px; font-size: 20px; } .ok-box p { color: var(--muted); margin: 0; }
.mini { font-size: 13px; color: var(--muted); margin-top: 8px; }
.pie { text-align: center; color: var(--muted); font-size: 12px; margin-top: 26px; }
.err { background: #fff; border-radius: 14px; padding: 24px; text-align: center; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; } .toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="cab"><div class="obra" id="h-obra">Obra</div><h1 id="h-tit">Fotos de avance</h1><div class="sub" id="h-sub"></div></div>
<main id="main"><div class="err">Cargando…</div></main>
<div class="toast" id="toast"></div>
<input type="file" id="f-cam" accept="image/*" capture="environment" style="display:none" onchange="agregar(this)">
<input type="file" id="f-gal" accept="image/*" multiple style="display:none" onchange="agregar(this)">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// v55: achica las fotos en el celular antes de subirlas (lado mayor 1600 px, JPEG) · si algo falla sube la original
async function achicarFoto(file, max = 1600, q = 0.82){
  if (!file || !/^image\//.test(file.type || '') || /gif|svg/i.test(file.type)) return file;
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });
    const w0 = img.naturalWidth, h0 = img.naturalHeight, k = Math.min(1, max / Math.max(w0, h0));
    const c = document.createElement('canvas'); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', q));
    if (!blob || (k === 1 && blob.size >= file.size)) return file;
    return new File([blob], (file.name || 'foto').replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e) { return file; }
}
const ICO_CAM = '<svg class="ico" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
const ICO_GAL = '<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let T = null, L = null, sb = null, F = [], hechas = 0;
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2600); }
function render(){
  document.getElementById('h-obra').textContent = L.obra.nombre || 'Obra'; document.getElementById('h-tit').textContent = L.tarea.titulo; document.title = 'Fotos · ' + L.tarea.titulo;
  document.getElementById('h-sub').textContent = 'Fotos de avance · ' + L.nombre;
  const et = (L.etapas || []);
  document.getElementById('main').innerHTML = `<div class="card"><div class="hola">Hola ${esc(L.nombre.split(' ')[0])} 👋</div><p>Sacá o elegí las fotos de cómo va el trabajo. Las ve el arquitecto y Claudia Adorno.</p>
      <div class="bts"><button class="btn" onclick="document.getElementById('f-cam').click()">${ICO_CAM} Sacar foto</button><button class="btn sec" onclick="document.getElementById('f-gal').click()">${ICO_GAL} Galería</button></div>
      <div class="grid" id="grid"></div>
      ${et.length ? `<div class="lbl">¿De qué parte del trabajo son?</div><select id="etapa"><option value="">General</option>${et.map(e => `<option value="${e.id}">${esc(e.titulo)}${e.hecha ? ' ✓' : ''}</option>`).join('')}</select>` : ''}
      <div class="lbl">Qué se hizo (opcional)</div><input id="com" maxlength="300" placeholder="Ej.: terminamos el revoque del lado de la Shell">
      <button class="btn full" id="subir" onclick="subir()" disabled>Elegí las fotos</button>
      ${L.fotos_hoy ? `<div class="mini">Hoy ya se subieron ${L.fotos_hoy} foto${L.fotos_hoy === 1 ? '' : 's'} con este link.</div>` : ''}</div>
    <div class="pie">Seguimiento de obra · Claudia Adorno</div>`;
}
function pintarGrid(){
  document.getElementById('grid').innerHTML = F.map((f, i) => `<div class="th ${f.ok ? 'ok' : ''}" style="background-image:url('${f.url}')">${f.ok ? '' : `<button onclick="sacar(${i})" aria-label="Sacar">×</button>`}</div>`).join('');
  const b = document.getElementById('subir'), n = F.filter(f => !f.ok).length; b.disabled = !n; b.textContent = n ? `Subir ${n} foto${n === 1 ? '' : 's'}` : 'Elegí las fotos';
}
function agregar(inp){ for (const f of inp.files || []) if (/^image\//.test(f.type || '') || /\.(jpe?g|png|heic|heif|webp)$/i.test(f.name)) F.push({ file: f, url: URL.createObjectURL(f) }); inp.value = ''; pintarGrid(); }
function sacar(i){ URL.revokeObjectURL(F[i].url); F.splice(i, 1); pintarGrid(); }
async function subir(){
  const pend = F.filter(f => !f.ok); if (!pend.length) return;
  const b = document.getElementById('subir'); b.disabled = true;
  const etapa = (document.getElementById('etapa') || {}).value || null, com = document.getElementById('com').value.trim();
  let n = 0;
  try {
    for (const f of pend){
      b.textContent = `Subiendo ${n + 1} de ${pend.length}…`;
      const chica = await achicarFoto(f.file), ext = chica.type === 'image/jpeg' ? 'jpg' : ((chica.name.split('.').pop() || 'jpg').toLowerCase());
      const path = `links/${T}/${Date.now()}_${n}.${ext}`;
      const up = await sb.storage.from('obra').upload(path, chica, { contentType: chica.type || 'image/jpeg' }); if (up.error) throw up.error;
      const r = await sb.rpc('obra_fotos_link_subir', { p_token: T, p_path: path, p_mime: chica.type || 'image/jpeg', p_etapa: etapa ? Number(etapa) : null, p_comentario: com || null, p_aviso: n === pend.length - 1, p_cant: pend.length }); if (r.error) throw r.error;
      f.ok = true; n++; pintarGrid();
    }
  } catch (e) { toast('No se pudo subir: ' + (e.message || e)); pintarGrid(); return; }
  hechas += n; F.forEach(f => URL.revokeObjectURL(f.url)); F = [];
  document.getElementById('main').innerHTML = `<div class="card ok-box"><div class="em">✅</div><h2>¡Listo, gracias!</h2><p>Subiste ${hechas} foto${hechas === 1 ? '' : 's'}. Ya le llegó el aviso al arquitecto.</p><button class="btn full" onclick="otraVez()">Subir más fotos</button></div><div class="pie">Seguimiento de obra · Claudia Adorno</div>`;
  window.scrollTo(0, 0);
}
function otraVez(){ render(); pintarGrid(); }
(async () => {
  T = new URLSearchParams(location.search).get('t') || '';
  sb = window.supabase.createClient('https://jfwtiagteuwmyvblgwms.supabase.co', 'sb_publishable_udSPma98Sw9eskeeLCgdCw_S2vIX0Fk', { auth: { persistSession: false } });
  const { data, error } = await sb.rpc('obra_fotos_link_info', { p_token: T });
  if (error || !data){ document.getElementById('main').innerHTML = '<div class="err">Este link no existe o fue desactivado. Pedile uno nuevo al arquitecto.</div>'; return; }
  L = data; render(); pintarGrid();
})();
</script>
</body>
</html>
